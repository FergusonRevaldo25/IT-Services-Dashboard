<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: white; }
        .login-box { max-width: 400px; margin: 100px auto; background: #16213e; padding: 2rem; border-radius: 10px; text-align: center; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: #0f0f23; color: white; }
        .login-box button { width: 100%; padding: 10px; background: #667eea; border: none; color: white; border-radius: 5px; cursor: pointer; }
        .admin-panel { display: none; }
        .sidebar { width: 250px; background: #16213e; padding: 1rem; position: fixed; height: 100%; overflow-y: auto; }
        .content { margin-left: 250px; padding: 2rem; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: #16213e; padding: 1rem; border-radius: 10px; text-align: center; }
        .stat-card h3 { font-size: 2rem; color: #ffd89b; }
        .nav-link { display: block; padding: 10px; margin: 5px 0; background: #0f0f23; border-radius: 5px; cursor: pointer; text-decoration: none; color: white; }
        .nav-link:hover { background: #667eea; }
        table { width: 100%; background: #16213e; border-radius: 10px; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #2a2a4a; }
        .message-item { background: #16213e; padding: 1rem; margin: 0.5rem 0; border-radius: 5px; }
        .error-msg { color: #ff6b6b; margin-top: 10px; }
        .success-msg { color: #4caf50; margin-top: 10px; }
        @media (max-width: 768px) { .sidebar { width: 100%; position: relative; height: auto; } .content { margin-left: 0; } .stats { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-box">
        <i class="fas fa-crown fa-3x" style="color: #667eea;"></i>
        <h2>Admin Login</h2>
        <p style="margin: 10px 0; font-size: 12px;">admin@itpro.com / admin123</p>
        <input type="email" id="adminEmail" placeholder="Email" value="admin@itpro.com">
        <input type="password" id="adminPassword" placeholder="Password" value="admin123">
        <button onclick="doAdminLogin()">Login</button>
        <div id="loginError" class="error-msg"></div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="admin-panel">
        <div class="sidebar">
            <h3><i class="fas fa-crown"></i> Admin Panel</h3>
            <div class="nav-link" onclick="loadDashboard()">📊 Dashboard</div>
            <div class="nav-link" onclick="loadOrders()">📦 Orders</div>
            <div class="nav-link" onclick="loadChats()">💬 Live Chats</div>
            <div class="nav-link" onclick="loadAnyDesk()">🖥️ AnyDesk Requests</div>
            <div class="nav-link" onclick="doAdminLogout()">🚪 Logout</div>
            <div class="nav-link" onclick="window.location.href='index.html'">🏠 Back to Site</div>
        </div>
        <div class="content" id="adminContent">
            <div style="text-align: center; padding: 2rem;">Loading dashboard...</div>
        </div>
    </div>

    <script>
        let adminToken = null;

        async function doAdminLogin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = '';
            
            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                console.log('Login response:', data);
                
                if (response.ok && data.user) {
                    adminToken = data.token;
                    localStorage.setItem('adminToken', adminToken);
                    localStorage.setItem('adminUser', JSON.stringify(data.user));
                    
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('adminDashboard').style.display = 'block';
                    
                    await loadDashboard();
                } else {
                    errorDiv.textContent = 'Login failed: ' + (data.error || 'Invalid credentials');
                }
            } catch(err) {
                errorDiv.textContent = 'Connection error: ' + err.message;
                console.error(err);
            }
        }

        async function callAdminAPI(endpoint) {
            if (!adminToken) {
                adminToken = localStorage.getItem('adminToken');
            }
            
            const response = await fetch(`http://localhost:3000${endpoint}`, {
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${adminToken}`
                }
            });
            
            if (response.status === 401) {
                doAdminLogout();
                throw new Error('Session expired. Please login again.');
            }
            
            return response.json();
        }

        async function loadDashboard() {
            const contentDiv = document.getElementById('adminContent');
            contentDiv.innerHTML = '<div style="text-align: center; padding: 2rem;">Loading stats...</div>';
            
            try {
                const stats = await callAdminAPI('/api/admin/stats');
                contentDiv.innerHTML = `
                    <h1>Dashboard Overview</h1>
                    <div class="stats">
                        <div class="stat-card"><i class="fas fa-users"></i><h3>${stats.total_users || 0}</h3><p>Total Users</p></div>
                        <div class="stat-card"><i class="fas fa-shopping-cart"></i><h3>${stats.total_orders || 0}</h3><p>Total Orders</p></div>
                        <div class="stat-card"><i class="fas fa-dollar-sign"></i><h3>$${stats.revenue || 0}</h3><p>Revenue</p></div>
                        <div class="stat-card"><i class="fas fa-comment"></i><h3>${stats.unread_chats || 0}</h3><p>Unread Messages</p></div>
                    </div>
                `;
            } catch(err) {
                contentDiv.innerHTML = `<div style="color: #ff6b6b; text-align: center; padding: 2rem;">Error: ${err.message}</div>`;
            }
        }

        async function loadOrders() {
            const contentDiv = document.getElementById('adminContent');
            contentDiv.innerHTML = '<div style="text-align: center; padding: 2rem;">Loading orders...</div>';
            
            try {
                const orders = await callAdminAPI('/api/admin/orders');
                
                if (!orders || orders.length === 0) {
                    contentDiv.innerHTML = '<h1>Orders</h1><p>No orders found.</p>';
                    return;
                }
                
                let html = '<h1>Orders Management</h1><table><thead><tr><th>Order #</th><th>Customer</th><th>Email</th><th>Amount</th><th>Status</th></tr></thead><tbody>';
                orders.forEach(o => {
                    let statusColor = o.status === 'completed' ? '#4caf50' : (o.status === 'processing' ? '#2196f3' : '#ff9800');
                    html += `<tr>
                        <td>${o.order_number}</td>
                        <td>${o.username || 'N/A'}</td>
                        <td>${o.email}</td>
                        <td>$${o.total_amount}</td>
                        <td><span style="background:${statusColor};padding:2px 8px;border-radius:20px;">${o.status}</span></td>
                    </tr>`;
                });
                html += '</tbody></table>';
                contentDiv.innerHTML = html;
            } catch(err) {
                contentDiv.innerHTML = `<div style="color: #ff6b6b; text-align: center; padding: 2rem;">Error: ${err.message}</div>`;
            }
        }

        async function loadChats() {
            const contentDiv = document.getElementById('adminContent');
            contentDiv.innerHTML = '<div style="text-align: center; padding: 2rem;">Loading chats...</div>';
            
            try {
                const chats = await callAdminAPI('/api/admin/chats');
                const userChats = chats.filter(c => c.is_admin === 0);
                
                if (userChats.length === 0) {
                    contentDiv.innerHTML = '<h1>Live Customer Chats</h1><p>No customer messages yet.</p>';
                    return;
                }
                
                let html = '<h1>Live Customer Chats</h1>';
                userChats.forEach(chat => {
                    html += `
                        <div class="message-item">
                            <strong>👤 ${chat.user_name || 'Guest'}</strong>
                            <small>${new Date(chat.created_at).toLocaleString()}</small>
                            <p><strong>Message:</strong> ${chat.message}</p>
                            ${chat.is_anydesk_request ? `<p style="color:#ff5722;"><strong>🖥️ AnyDesk ID:</strong> ${chat.anydesk_id}</p>` : ''}
                        </div>
                    `;
                });
                contentDiv.innerHTML = html;
            } catch(err) {
                contentDiv.innerHTML = `<div style="color: #ff6b6b; text-align: center; padding: 2rem;">Error: ${err.message}</div>`;
            }
        }

        async function loadAnyDesk() {
            const contentDiv = document.getElementById('adminContent');
            contentDiv.innerHTML = '<div style="text-align: center; padding: 2rem;">Loading requests...</div>';
            
            try {
                const chats = await callAdminAPI('/api/admin/chats');
                const anydeskRequests = chats.filter(c => c.is_anydesk_request === 1);
                
                if (anydeskRequests.length === 0) {
                    contentDiv.innerHTML = '<h1>AnyDesk Remote Support Requests</h1><p>No AnyDesk requests yet.</p>';
                    return;
                }
                
                let html = '<h1>AnyDesk Remote Support Requests</h1><table><thead><tr><th>User</th><th>Request Time</th><th>AnyDesk ID</th><th>Status</th></tr></thead><tbody>';
                anydeskRequests.forEach(req => {
                    html += `<tr>
                        <td>${req.user_name || 'Guest'}</td>
                        <td>${new Date(req.created_at).toLocaleString()}</td>
                        <td><strong style="color:#ff5722;">${req.anydesk_id}</strong></td>
                        <td><span style="background:${req.status === 'unread' ? '#ff4444' : '#4caf50'};padding:2px 8px;border-radius:20px;">${req.status}</span></td>
                    </tr>`;
                });
                html += '</tbody></table>';
                contentDiv.innerHTML = html;
            } catch(err) {
                contentDiv.innerHTML = `<div style="color: #ff6b6b; text-align: center; padding: 2rem;">Error: ${err.message}</div>`;
            }
        }

        function doAdminLogout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            adminToken = null;
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('adminDashboard').style.display = 'none';
            document.getElementById('adminEmail').value = 'admin@itpro.com';
            document.getElementById('adminPassword').value = 'admin123';
        }

        // Check existing session on page load
        const savedToken = localStorage.getItem('adminToken');
        if (savedToken) {
            adminToken = savedToken;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            loadDashboard();
        }
    </script>
</body>
</html>
