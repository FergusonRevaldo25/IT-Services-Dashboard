<!doctype html>
<html lang="en">
  <head>
    <!-- SEO Meta Tags -->
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Login to your IT Pro Solutions account to access IT services, track orders, and manage subscriptions."
    />
    <meta
      name="keywords"
      content="login, IT support login, customer portal, account access"
    />
    <meta name="author" content="IT Pro Solutions" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Login - IT Pro Solutions" />
    <meta
      property="og:description"
      content="Access your IT Pro Solutions account"
    />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="../assets/images/branding/favicon.ico"
    />
    <link rel="apple-touch-icon" href="../assets/images/branding/logo.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="../css/style.css" />

    <title>Login - IT Pro Solutions | Access Your Account</title>

    <style>
      .login-container {
        min-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem;
      }
      .login-box {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 2rem;
        border-radius: 20px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .login-box h2 {
        text-align: center;
        margin-bottom: 0.5rem;
      }
      .login-subtitle {
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.85rem;
        margin-bottom: 2rem;
      }
      .input-group {
        margin-bottom: 1.25rem;
      }
      .input-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.85rem;
        font-weight: 500;
      }
      .input-group input {
        width: 100%;
        padding: 0.85rem;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border-radius: 12px;
        font-size: 1rem;
        transition: all 0.3s;
      }
      .input-group input:focus {
        outline: none;
        border-color: #667eea;
        background: rgba(255, 255, 255, 0.15);
      }
      .input-group input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }

      /* CAPTCHA Styles */
      .captcha-container {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 12px;
        padding: 1rem;
        margin: 1.25rem 0;
      }
      .captcha-display {
        background: rgba(0, 0, 0, 0.5);
        border-radius: 10px;
        padding: 1rem;
        text-align: center;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .captcha-code {
        font-size: 1.8rem;
        font-weight: bold;
        letter-spacing: 8px;
        font-family: "Courier New", monospace;
        background: #1a1a2e;
        padding: 0.5rem 1rem;
        border-radius: 10px;
        color: #ffd89b;
      }
      .refresh-captcha {
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 0.85rem;
      }
      .refresh-captcha:hover {
        background: #667eea;
      }
      .captcha-input {
        margin-top: 0.75rem;
      }
      .captcha-input input {
        text-align: center;
        letter-spacing: 2px;
      }

      /* Remember me & Forgot password */
      .login-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 1rem 0;
        font-size: 0.85rem;
      }
      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
      }
      .checkbox-label input {
        width: auto;
      }
      .forgot-link {
        color: #ffd89b;
        text-decoration: none;
      }
      .forgot-link:hover {
        text-decoration: underline;
      }

      /* Login Button */
      .login-btn {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 0.5rem;
      }
      .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
      }
      .login-btn:active {
        transform: translateY(0);
      }

      /* Social Login */
      .social-login {
        text-align: center;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .social-login p {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 1rem;
      }
      .social-icons {
        display: flex;
        justify-content: center;
        gap: 1rem;
      }
      .social-icon {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
        cursor: pointer;
        font-size: 1.2rem;
      }
      .social-icon:hover {
        background: rgba(102, 126, 234, 0.6);
        transform: translateY(-2px);
      }

      /* Signup Link */
      .signup-link {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.85rem;
      }
      .signup-link a {
        color: #ffd89b;
        text-decoration: none;
        font-weight: bold;
      }
      .signup-link a:hover {
        text-decoration: underline;
      }

      /* Error Message */
      .error-message {
        background: rgba(244, 67, 54, 0.2);
        border: 1px solid #f44336;
        border-radius: 10px;
        padding: 0.75rem;
        margin-bottom: 1rem;
        font-size: 0.85rem;
        color: #ff8888;
        display: none;
      }

      /* Success Message */
      .success-message {
        background: rgba(76, 175, 80, 0.2);
        border: 1px solid #4caf50;
        border-radius: 10px;
        padding: 0.75rem;
        margin-bottom: 1rem;
        font-size: 0.85rem;
        color: #8bc34a;
        display: none;
      }

      /* Responsive */
      @media (max-width: 480px) {
        .login-box {
          padding: 1.5rem;
        }
        .captcha-code {
          font-size: 1.2rem;
          letter-spacing: 4px;
        }
        .login-options {
          flex-direction: column;
          gap: 0.5rem;
          align-items: flex-start;
        }
      }

      /* Demo Credentials Hint */
      .demo-hint {
        background: rgba(255, 216, 155, 0.15);
        border-left: 3px solid #ffd89b;
        padding: 0.75rem;
        margin-bottom: 1.5rem;
        border-radius: 8px;
        font-size: 0.75rem;
      }
      .demo-hint i {
        color: #ffd89b;
        margin-right: 0.5rem;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <div class="logo">
          <h2>IT<span class="highlight">Pro</span></h2>
        </div>
        <div class="nav-links">
          <a href="../index.html">HOME</a>
          <a href="../services.html">SERVICES</a>
          <a href="../company.html">COMPANY</a>
          <a href="../dashboard.html">DASHBOARD</a>
          <a href="../news.html">NEWS</a>
          <a href="login.html" class="active">LOGIN</a>
        </div>
        <div class="search-bar">
          <input type="text" placeholder="Search..." />
          <i class="fas fa-search"></i>
        </div>
      </div>
    </nav>

    <div class="login-container">
      <div class="login-box">
        <h2><i class="fas fa-lock"></i> Welcome Back</h2>
        <div class="login-subtitle">
          Login to access your IT Pro Solutions account
        </div>

        <div class="demo-hint">
          <i class="fas fa-info-circle"></i> Demo Credentials:
          <strong>demo@itpro.com</strong> / <strong>demo123</strong>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm">
          <div class="input-group">
            <label><i class="fas fa-envelope"></i> Email Address</label>
            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>
          <div class="input-group">
            <label><i class="fas fa-key"></i> Password</label>
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <div class="login-options">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" /> Remember me
            </label>
            <a
              href="#"
              class="forgot-link"
              onclick="
                forgotPassword();
                return false;
              "
              >Forgot Password?</a
            >
          </div>

          <!-- CAPTCHA Section -->
          <div class="captcha-container">
            <div class="captcha-display">
              <span class="captcha-code" id="captchaCode"></span>
              <button
                type="button"
                class="refresh-captcha"
                onclick="refreshCaptcha()"
              >
                <i class="fas fa-sync-alt"></i> Refresh
              </button>
            </div>
            <div class="captcha-input">
              <input
                type="text"
                id="captchaInput"
                placeholder="Enter the code above"
                autocomplete="off"
              />
            </div>
          </div>

          <button type="submit" class="login-btn">
            <i class="fas fa-sign-in-alt"></i> Login
          </button>
        </form>

        <div class="social-login">
          <p>Or login with</p>
          <div class="social-icons">
            <div class="social-icon" onclick="socialLogin('google')">
              <i class="fab fa-google"></i>
            </div>
            <div class="social-icon" onclick="socialLogin('facebook')">
              <i class="fab fa-facebook-f"></i>
            </div>
            <div class="social-icon" onclick="socialLogin('apple')">
              <i class="fab fa-apple"></i>
            </div>
            <div class="social-icon" onclick="socialLogin('microsoft')">
              <i class="fab fa-microsoft"></i>
            </div>
          </div>
        </div>

        <div class="signup-link">
          <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
        </div>
      </div>
    </div>

    <script>
      let currentCaptcha = "";

      // Generate CAPTCHA
      function generateCaptcha() {
        const chars =
          "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
        let captcha = "";
        for (let i = 0; i < 6; i++) {
          captcha += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return captcha;
      }

      function refreshCaptcha() {
        currentCaptcha = generateCaptcha();
        document.getElementById("captchaCode").textContent = currentCaptcha;
        document.getElementById("captchaInput").value = "";
      }

      // Show error message
      function showError(message) {
        const errorDiv = document.getElementById("errorMessage");
        errorDiv.textContent = message;
        errorDiv.style.display = "block";
        setTimeout(() => {
          errorDiv.style.display = "none";
        }, 4000);
      }

      function showSuccess(message) {
        const successDiv = document.getElementById("successMessage");
        successDiv.textContent = message;
        successDiv.style.display = "block";
        setTimeout(() => {
          successDiv.style.display = "none";
        }, 3000);
      }

      // Forgot password
      function forgotPassword() {
        const email = document.getElementById("email").value;
        if (email && email.includes("@")) {
          showSuccess(`Password reset link sent to ${email}`);
        } else {
          showError("Please enter your email address first");
        }
      }

      // Social login (demo)
      function socialLogin(provider) {
        showSuccess(`Logging in with ${provider}...`);
        setTimeout(() => {
          window.location.href = "../dashboard.html";
        }, 1500);
      }

      // Check if user is already logged in
      function checkLoggedIn() {
        const loggedIn = localStorage.getItem("isLoggedIn");
        if (loggedIn === "true") {
          window.location.href = "../dashboard.html";
        }
      }

      // Login form submission
      document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const userCaptcha = document.getElementById("captchaInput").value;
        const rememberMe = document.getElementById("rememberMe").checked;

        // Validate CAPTCHA
        if (userCaptcha !== currentCaptcha) {
          showError("Invalid CAPTCHA! Please try again.");
          refreshCaptcha();
          return;
        }

        // Validate email and password
        if (!email || !password) {
          showError("Please enter both email and password");
          return;
        }

        // Demo login validation
        if (email === "demo@itpro.com" && password === "demo123") {
          showSuccess("Login successful! Redirecting to dashboard...");

          if (rememberMe) {
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("userEmail", email);
          } else {
            sessionStorage.setItem("isLoggedIn", "true");
            sessionStorage.setItem("userEmail", email);
          }

          setTimeout(() => {
            window.location.href = "../dashboard.html";
          }, 1500);
        } else {
          showError("Invalid email or password. Try demo@itpro.com / demo123");
          refreshCaptcha();
        }
      });

      // Load saved email if remembered
      function loadSavedEmail() {
        const savedEmail = localStorage.getItem("userEmail");
        if (savedEmail) {
          document.getElementById("email").value = savedEmail;
          document.getElementById("rememberMe").checked = true;
        }
      }

      // Initialize
      checkLoggedIn();
      refreshCaptcha();
      loadSavedEmail();
    </script>
  </body>
</html>
